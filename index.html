<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#141414;--mut:#737373;--pri:#e3191f;--pri2:#b51218;--soft:#fdeaea;--bd:#e7e5e4;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--sh:0 6px 24px rgba(0,0,0,.08);--r:16px;--hd1:#b51218;--hd2:#262626}
[data-theme=dark]{--bg:#0a0a0a;--card:#171717;--tx:#f1f1f1;--mut:#a3a3a3;--pri:#ff4a50;--pri2:#e3191f;--soft:#2b1517;--bd:#2a2a2a;--sh:0 6px 24px rgba(0,0,0,.35);--hd1:#000000;--hd2:#1c1c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;min-height:48px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
label{display:block;font-size:13.5px;color:var(--mut);margin:14px 0 6px;font-weight:600}
svg{flex-shrink:0;vertical-align:middle}
.mut{color:var(--mut)}.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.rcb{font-size:2em;line-height:1.2}
.logo{font-weight:800;font-size:28px;letter-spacing:.2em;color:var(--pri)}.logo span{color:var(--tx);font-weight:300;margin-left:.3em;letter-spacing:.14em}
.logo.sm{color:#fff;font-size:23px;font-weight:700;letter-spacing:.36em;margin-right:-.36em;white-space:nowrap;text-align:center}.logo.sm span{color:#fde2e2;font-weight:300;letter-spacing:.36em;margin-left:.45em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--bd);background:var(--card);padding:12px 20px;min-height:50px;font-size:16px;border-radius:14px;font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(227,25,31,.28)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:10px 16px;min-height:46px;font-size:15px;border-radius:12px}.btn.big{width:100%;padding:17px;font-size:17.5px;margin-top:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.ib{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);display:inline-grid;place-items:center;padding:0}
.link{background:none;border:0;color:var(--mut);margin-top:10px;width:100%}
em{font-style:normal}
#app{height:100%}
.lock{height:100%;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lockbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px;text-align:center;box-shadow:var(--sh)}
.lockbox label{text-align:left}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 18px 6px;background:none;color:#fff}.topbar{background:linear-gradient(135deg,var(--hd1),var(--hd2));border-radius:0 0 26px 26px;box-shadow:0 10px 28px rgba(0,0,0,.3);position:relative;z-index:5;flex-shrink:0}.hl{min-width:0;font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.3}.hl b{color:#fff;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:8px 14px 14px;background:none}.nav::-webkit-scrollbar{display:none}
.nv{display:inline-flex;align-items:center;gap:9px;border:0;background:transparent;color:rgba(255,255,255,.86);padding:13px 22px;min-height:52px;font-size:16.5px;border-radius:14px;font-weight:600;white-space:nowrap;position:relative}
.nv.on{background:#fff;color:#b51218;box-shadow:0 6px 16px rgba(0,0,50,.25)}
.nv em{background:#ffcf40;color:#3a2a00;border-radius:99px;font-size:12.5px;padding:1px 8px;font-weight:700}
.hr{display:flex;gap:10px;align-items:center;justify-self:end}header .ib{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32);color:#fff}header .btn.bad{background:#fff;border-color:#fff;color:var(--bad);box-shadow:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 410px;gap:14px;padding:14px}
.left{overflow:auto;min-width:0;padding-right:2px}
.catx,#catbtn,.chip .ci{display:none}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.catpick .btn{flex:1 1 140px;min-height:48px;font-weight:600}
@media (min-width:1100px){
 .left.rail.railmin{grid-template-columns:62px minmax(0,1fr)}
 .left.railmin>#cats{padding-right:4px}
 .left.railmin>#cats .chip{padding:0;text-align:center;min-height:46px;font-size:14px;letter-spacing:.2px;display:flex;align-items:center;justify-content:center}
 .left.railmin>#cats .chip .cf{display:none}.left.railmin>#cats .chip .ci{display:inline}
 .left.railmin .catx{padding:0;justify-content:center;font-size:18px;min-height:40px}
 .left.rail .catx{display:flex;align-items:center;gap:6px;border:1px dashed var(--bd);background:transparent;border-radius:12px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600;color:var(--mut,#6b7a99);width:100%}
 .left.rail{display:grid;grid-template-columns:168px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:14px;row-gap:0;overflow:hidden;padding-right:0}
 .left.rail>#promo,.left.rail>.vtop{grid-column:1/-1}
 .left.rail>#cats{grid-column:1;grid-row:3;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;padding:10px 6px 10px 0;gap:8px;min-height:0}
 .left.rail>#cats .chip{border-radius:14px;text-align:left;white-space:normal;line-height:1.25;padding:13px 16px;min-height:50px;width:100%}
 .left.rail>#grid{grid-column:2;grid-row:3;overflow:auto;min-height:0;align-content:start;grid-auto-rows:max-content;padding-top:10px}
}

/* Promo, voucher & poin: datanya diatur di Backoffice dan ikut tersinkron ke sini (db.promos) */
const dayKey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function promoLive(x){
 if(!x||!x.active)return false;
 const n=new Date(),k=dayKey(n),t=p2(n.getHours())+':'+p2(n.getMinutes());
 if(x.start&&k<x.start)return false;if(x.end&&k>x.end)return false;
 if(x.days&&x.days.length&&!x.days.includes(n.getDay()))return false;
 if(x.tStart&&x.tEnd&&x.tStart!==x.tEnd){const ok=x.tStart<x.tEnd?(t>=x.tStart&&t<x.tEnd):(t>=x.tStart||t<x.tEnd);if(!ok)return false}
 return true;
}
function activePromos(){return(db.promos||[]).filter(x=>(x.kind||'auto')==='auto'&&promoLive(x))}
function promoCut(x,base,qty){
 let v=x.type==='percent'?base*(+x.value||0)/100:(+x.value||0)*(x.scope==='all'||!x.scope?1:qty);
 if(+x.maxDisc>0)v=Math.min(v,+x.maxDisc);
 return Math.max(0,Math.min(v,base));
}
function vchFind(code){code=String(code||'').trim().toUpperCase();return(db.promos||[]).find(x=>x.kind==='voucher'&&String(x.code||'').toUpperCase()===code)}
function vchUsed(code){code=String(code||'').toUpperCase();return db.tx.filter(t=>t.status!=='void'&&String(t.voucher||'').toUpperCase()===code).length}
function vchCheck(code,sub){
 const v=vchFind(code);if(!v)return{err:'Kode voucher tidak ditemukan'};
 if(!v.active)return{err:'Voucher tidak aktif'};
 const n=dayKey(new Date());
 if(v.start&&n<v.start)return{err:'Voucher belum berlaku (mulai '+v.start+')'};
 if(v.end&&n>v.end)return{err:'Voucher sudah berakhir'};
 if(!promoLive(v))return{err:'Voucher tidak berlaku di hari/jam ini'};
 if((+v.minBuy||0)>sub)return{err:'Minimal belanja '+rp(v.minBuy)};
 if(+v.quota>0&&vchUsed(v.code)>=+v.quota)return{err:'Kuota voucher sudah habis'};
 return{ok:1,v};
}
function loyalty(){const l=(db.promos||[]).find(x=>x.kind==='loyalty');return(l&&l.active&&+l.earnPer>0&&+l.pointValue>0)?l:null}
function ptBalance(id){return Math.max(0,sum(db.tx.filter(t=>t.customerId===id&&t.status!=='void'),t=>(+t.ptEarn||0)-(+t.ptUsed||0)))}
function roundAmt(x){const u=+db.settings.roundUnit||0;if(!u)return x;const m=db.settings.roundMode;return m==='up'?Math.ceil(x/u)*u:m==='down'?Math.floor(x/u)*u:Math.round(x/u)*u}
function calc(items,manual,type,o){
 o=o||{};
 const st=db.settings;
 const sub=Math.round(sum(items,i=>i.qty*i.price)),qty=sum(items,i=>i.qty);
 let auto=0;const names=[];
 const rem=items.map(i=>i.qty*i.price),live=activePromos();
 /* 1. promo per produk / kategori (boleh bertumpuk) */
 live.filter(x=>x.scope==='product'||x.scope==='cat').forEach(x=>{
  if((+x.minBuy||0)>sub)return;
  const part=items.map((l,k)=>{const hit=x.scope==='product'?l.pid===x.productId:(l.cat||catOf(l.pid))===x.cat;return hit?promoCut(x,rem[k],l.qty):0});
  let v=sum(part,a=>a);if(!(v>0))return;
  if(+x.maxDisc>0&&v>+x.maxDisc){const f=+x.maxDisc/v;part.forEach((a,k)=>part[k]=a*f);v=+x.maxDisc}
  part.forEach((a,k)=>rem[k]-=a);auto+=v;names.push(x.name);
 });
 /* 2. promo per total belanja: hanya satu yang paling menguntungkan */
 let best=null,bv=0;
 live.filter(x=>x.scope==='all'||!x.scope).forEach(x=>{if((+x.minBuy||0)>sub)return;const v=promoCut(x,Math.max(0,sub-auto),qty);if(v>bv){bv=v;best=x}});
 if(best){auto+=bv;names.push(best.name)}
 auto=Math.min(Math.round(auto),sub);
 /* 3. voucher */
 let vch=0,vcode='';
 if(!o.nov&&S.voucher){const r=vchCheck(S.voucher,sub);if(r.ok){vch=Math.round(promoCut({...r.v,scope:'all'},Math.max(0,sub-auto),qty));vcode=r.v.code}}
 /* 4. tukar poin */
 let pt=0,ptUsed=0;const L=loyalty(),cu=custOf();
 if(!o.nov&&L&&cu&&S.pts>0){
  const left=Math.max(0,sub-auto-vch),cap=Math.floor(left*Math.min(100,+L.maxPct||100)/100/L.pointValue);
  ptUsed=Math.max(0,Math.min(Math.floor(S.pts),ptBalance(cu.id),cap));
  if(ptUsed<(+L.minRedeem||0))ptUsed=0;
  pt=Math.round(ptUsed*L.pointValue);
 }
 /* 5. diskon manual kasir */
 const b0=sub-auto-vch-pt;
 let man=manual.type==='pct'?Math.round(b0*Math.min(manual.val||0,100)/100):Math.min(Math.round(manual.val||0),b0);
 man=Math.max(0,man);
 const net=Math.max(0,b0-man);
 const sp=+st.servicePct||0,tp=+st.taxPct||0,incl=st.taxMode==='incl';
 const svc=(sp>0&&(!st.serviceDineOnly||type==='dine'))?Math.round(net*sp/100):0;
 const base=net+svc;
 const tax=tp>0?(incl?Math.round(base*tp/(100+tp)):Math.round(base*tp/100)):0;
 const raw=base+(incl?0:tax);
 const total=Math.max(0,roundAmt(raw));
 return{sub,auto,names,vch,vcode,pt,ptUsed,man,net,svc,svcPct:svc?sp:0,tax,taxPct:tax?tp:0,taxIncl:incl,rounding:total-raw,total};
}

const feeNet=t=>(t.feeTot||0)*(1-Math.min(1,(t.refunded||0)/(t.total||1)));
function defFees(){const m=()=>({pct:0,flat:0}),h=()=>({svc:0,adm:0,ship:0});return{mdr:{qris:m(),debit:m(),kredit:m(),transfer:m(),ewallet:m()},chan:{shopee:h(),grab:h(),gofood:h()}}}
function feeCfg(){const d=defFees(),f=db.settings.fees||{},o={mdr:{},chan:{}};Object.keys(d.mdr).forEach(k=>o.mdr[k]={...d.mdr[k],...((f.mdr||{})[k]||{})});Object.keys(d.chan).forEach(k=>o.chan[k]={...d.chan[k],...((f.chan||{})[k]||{})});return o}
function calcFees(c,pays,type,channel,ratio){
 const F=feeCfg(),o={mdr:0,svc:0,adm:0,ship:0};
 const pm={};
 pays.forEach(p=>{const m=F.mdr[p.m]||pmxOf(p.m);if(m&&p.ap>0){const v=p.ap*(+m.pct||0)/100+(+m.flat||0);if(m.kind==='svc')o.svc+=v;else o.mdr+=v;if(v>0)pm[p.m]=(pm[p.m]||0)+v}});
 const h=type==='online'?F.chan[channel]:null;
 if(h){o.svc+=c.net*(+h.svc||0)/100;o.adm=(+h.adm||0)*ratio;o.ship=(+h.ship||0)*ratio}
 Object.keys(o).forEach(k=>o[k]=Math.round(o[k]));
 o.tot=o.mdr+o.svc+o.adm+o.ship;o.pm={};Object.keys(pm).forEach(k=>o.pm[k]=Math.round(pm[k]));return o;
}

 return{W,wrap,hr:'-'.repeat(W),
  c:s=>wrap(s).map(x=>' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x).join('\n'),
  lr:(l,r)=>{l=String(l);r=String(r);const sp=W-l.length-r.length;return sp>0?l+' '.repeat(sp)+r:l+'\n'+' '.repeat(Math.max(0,W-r.length))+r}};
}

function refundModal(id,keep){

 if(!keep)RF={id,qty:{},reason:'',method:''};

function rangeOf(p,from,to){
 const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(p==='today')return[d0,d0+864e5];
 if(p==='7d')return[d0-6*864e5,d0+864e5];
 if(p==='month')return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),d0+864e5];
 if(p==='all')return[0,Infinity];
 return[from?new Date(from).getTime():0,to?new Date(to).getTime()+60000:Infinity];
}

/* ---------- expired & batch (opsional, aktif dari Pengaturan > Expired / Batch) ---------- */
function expCfg(){const e=(db.settings&&db.settings.exp)||{};return{on:!!e.on,warn:Math.max(1,+e.warn||90),block:e.block!==false,req:e.req!==false}}
function expOn(){return expCfg().on}
function expTs(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():NaN}
function expDays(s){const d=new Date();d.setHours(0,0,0,0);return Math.round((expTs(s)-d.getTime())/864e5)}
function expFmt(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'-'}
function expAlloc(p){
 const bt=p.bt||[],m={},stock=Math.max(0,+p.stock||0);let fzT=0;
 bt.forEach(b=>{if(b.fz!==undefined)fzT+=+b.fz||0});
 let left=Math.max(0,stock-fzT);
 bt.filter(b=>b.fz===undefined).sort((a,b)=>expTs(b.exp)-expTs(a.exp)).forEach(b=>{const r=Math.min(left,+b.q||0);left=+(left-r).toFixed(3);m[b.id]=r});
 let fl=Math.min(fzT,stock);
 bt.filter(b=>b.fz!==undefined).sort((a,b)=>expTs(a.exp)-expTs(b.exp)).forEach(b=>{const r=Math.min(fl,+b.fz||0);fl=+(fl-r).toFixed(3);m[b.id]=r});
 return m;
}
function expRem(p){
 if(!p||p.notrack||!(p.bt||[]).length)return[];
 const m=expAlloc(p);
 return p.bt.map(b=>({b,rem:m[b.id]||0,d:expDays(b.exp)})).filter(x=>x.rem>0&&!isNaN(x.d)).sort((a,b)=>expTs(a.b.exp)-expTs(b.b.exp));
}
function expFreeze(p){
 if(!(p.bt||[]).length)return false;
 const ex=p.bt.filter(b=>b.fz===undefined&&expDays(b.exp)<0);if(!ex.length)return false;
 const m=expAlloc(p);ex.forEach(b=>{b.fz=+(m[b.id]||0)});p.upd=Date.now();return true;
}
function expCount(){
 const c=expCfg(),r={exp:0,warn:0,val:0};
 db.products.forEach(p=>{expRem(p).forEach(x=>{if(x.d<0){r.exp++;r.val+=x.rem*(+p.cogs||0)}else if(x.d<=c.warn)r.warn++})});
 return r;
}
function expInfo(p){
 if(!expOn())return'';const x=expRem(p)[0];if(!x)return'';
 if(x.d<0)return' · EXPIRED '+expFmt(x.b.exp);
 return x.d<=expCfg().warn?' · Exp '+expFmt(x.b.exp):'';
}
function expGate(p,used){
 if(!expOn()||p.notrack||!(p.bt||[]).length)return true;
 if(expFreeze(p))save();
 const bad=sum(expRem(p).filter(x=>x.d<0),x=>x.rem);
 if(!(bad>0))return true;
 if(used+1<=(+p.stock||0)-bad)return true;
 if(expCfg().block){toast(p.name+': sisa stok yang layak jual habis (ada '+fq(bad)+' '+p.unit+' sudah expired)');return false}
 return confirm(p.name+' memiliki '+fq(bad)+' '+p.unit+' yang sudah expired. Tetap dijual?');
}
function expAdd(p,exp,q,no){
 if(!p.bt)p.bt=[];
 p.bt.push({id:uid(),no:(no||'').trim().slice(0,30),exp:exp,q:+(+q).toFixed(3),ts:Date.now()});
 if(p.bt.length>20){const m=expAlloc(p);p.bt=p.bt.filter(b=>(m[b.id]||0)>0||b.id===p.bt[p.bt.length-1].id)}
 p.upd=Date.now();
}
function expTick(){
 if(!expOn())return;let ch=false;
 db.products.forEach(p=>{if(expFreeze(p))ch=true});if(ch)save();
 const c=expCount(),day=new Date().toISOString().slice(0,10);
 if((c.exp||c.warn)&&S.user&&db.expToast!==day){db.expToast=day;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}toast((c.exp?c.exp+' batch sudah expired. ':'')+(c.warn?c.warn+' batch akan expired dalam '+expCfg().warn+' hari. ':'')+'Buka Produk > Expired.')}
}
function expDispose(pid,bid){
 const p=db.products.find(x=>x.id===pid);if(!p)return;const b=(p.bt||[]).find(x=>x.id===bid);if(!b)return;
 expFreeze(p);const r=(expRem(p).find(x=>x.b.id===bid)||{rem:0}).rem;
 if(!confirm('Buang '+fq(r)+' '+p.unit+' '+p.name+' (exp '+expFmt(b.exp)+')? Stok akan dikurangi dan tercatat sebagai koreksi.'))return;
 if(r>0){const ns=+((+p.stock||0)-r).toFixed(3);p.stock=ns;p.base=ns;stkQ(p.id,p.name,-r,'adj')}
 p.bt=p.bt.filter(x=>x.id!==bid);p.upd=Date.now();
 (db.expLog=db.expLog||[]).push({ts:Date.now(),pid:p.id,name:p.name,no:b.no||'',exp:b.exp,q:r,cogs:+p.cogs||0,by:S.user?S.user.name:''});
 if(db.expLog.length>200)db.expLog=db.expLog.slice(-200);

}
function expDel(pid,bid){

function expBatchForm(pid){

  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.exp||''))return'Isi tanggal expired';
  if(!(o.q>0))return'Isi jumlah batch';
  if(o.q>(+p.stock||0))return'Jumlah melebihi stok ('+fq(p.stock)+')';

 },()=>setModal('exp'));
}

function parseCSV(txt){
 txt=txt.replace(/^\uFEFF/,'').replace(/^sep=.\r?\n/i,'');
 const first=txt.split(/\r?\n/)[0]||'',dl=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x!==''))rows.push(row);
 if(!rows.length)return[];
 const h=rows[0];return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]==null?'':r[i]])));
}

 return parseFloat(s);

 });

 async function link(p){

  const list=await srv.getPrimaryServices();
  list.sort((a,b)=>(SERVICES.includes(b.uuid)?1:0)-(SERVICES.includes(a.uuid)?1:0));
  let w=null;
  for(const s of list){const cs=await s.getCharacteristics();w=cs.find(c=>c.properties.write||c.properties.writeWithoutResponse);if(w)break}
  if(!w)throw new Error('Jalur tulis printer tidak ditemukan');
  p.chr=w;

 function reg(dev){

 }

 const enc=new TextEncoder();
 const clean=t=>String(t).replace(/[·•]/g,'-').replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/[^\x20-\x7E\n\x02-\x06]/g,'');
 /* teks struk -> byte printer: penanda gaya diubah jadi perintah ESC/POS standar */
 const encRC=t=>{const s=clean(t)+'\n\n\n\n',o=[];for(const ch of s){const c=ch.charCodeAt(0);if(c===6){const lg=rcGet().logo;if(lg){const raw=atob(lg.b),hb=lg.w/8;o.push(0x1B,0x61,1,0x1D,0x76,0x30,0,hb&255,hb>>8,lg.h&255,lg.h>>8);for(let i=0;i<raw.length;i++)o.push(raw.charCodeAt(i));o.push(0x1B,0x61,0)}}else if(c===2)o.push(0x1B,0x45,1);else if(c===3)o.push(0x1B,0x45,0);else if(c===4)o.push(0x1D,0x21,0x11);else if(c===5)o.push(0x1D,0x21,0);else o.push(c)}o.push(0x1B,0x45,0,0x1D,0x21,0);return Uint8Array.from(o)};
 async function send(p,bytes){
  for(let i=0;i<bytes.length;i+=100){
   const c=bytes.slice(i,i+100);
   if(p.chr.properties.writeWithoutResponse)await p.chr.writeValueWithoutResponse(c);else await p.chr.writeValue(c);
   await new Promise(r=>setTimeout(r,35));
  }
 }
 async function sendText(role,txt,copies){
  if(nat()){
   const body=encRC(txt),one=new Uint8Array(2+body.length);
   one.set([0x1B,0x40],0);one.set(body,2);
   const all=new Uint8Array(one.length*copies);for(let k=0;k<copies;k++)all.set(one,k*one.length);
   await nat().btSend({address:map[role].id,data:b64(all)});
   return;
  }
  const p=pool[map[role].id];
  const body=encRC(txt);
  const all=new Uint8Array(2+body.length);
  all.set([0x1B,0x40],0);all.set(body,2);
  for(let k=0;k<copies;k++)await send(p,all);

  const body=encRC(txt),parts=[];
  for(let k=0;k<copies;k++){parts.push(new Uint8Array([0x1B,0x40]),body);if(cut)parts.push(new Uint8Array([0x1D,0x56,0x42,0x00]))}
  const o=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let x=0;parts.forEach(p=>{o.set(p,x);x+=p.length});return o;
 }

 async function lanSend(role,txt,copies){
  const c=cfg.roles[role]||{};
  if(!c.ip)throw new Error('IP printer belum diisi');
  if(nat()){
   try{await nat().tcpSend({ip:c.ip,port:+c.port||9100,data:b64(makeBytes(txt,copies,c.cut!==false))})}
   catch(e){throw new Error((e&&e.message)||'printer tidak terjangkau (cek IP dan jaringan)')}
   return;
  }
  if(!cfg.relay)throw new Error('alamat relay belum diisi');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  try{
   const r=await fetch(relayURL()+'/print',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ip:c.ip,port:+c.port||9100,data:b64(makeBytes(txt,copies,c.cut!==false))}),signal:ctl.signal});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
  }catch(e){throw new Error(e.name==='AbortError'?'relay tidak merespons':e.message==='Failed to fetch'?'relay tidak terjangkau (cek alamat/jaringan)':e.message)}
  finally{clearTimeout(t)}

/* ===== Varian & Topping (maks. MAXOPT per produk) ===== */
const MAXOPT=20;
function parseOpts(str,what){
 const out=[],seen={};
 const parts=String(str==null?'':str).split(/[\n;|]+/).map(s=>s.trim()).filter(Boolean);
 if(parts.length>MAXOPT)return{err:'Maksimal '+MAXOPT+' '+what+' per produk (sekarang '+parts.length+')'};
 for(const s of parts){
  const a=s.split(':'),name=a[0].trim();
  if(!name)return{err:'Nama '+what+' kosong: "'+s+'"'};
  const price=(a[1]===undefined||a[1].trim()==='')?0:toNum(a[1]);
  const cogs=(a[2]===undefined||a[2].trim()==='')?0:toNum(a[2]);
  if(isNaN(price)||isNaN(cogs))return{err:'Harga '+what+' "'+name+'" tidak valid'};
  const k=name.toLowerCase();
  if(seen[k])return{err:'Nama '+what+' dobel: '+name};
  seen[k]=1;
  out.push({name:name,price:Math.round(price),cogs:Math.round(cogs)});
 }
 return{list:out};
}
function fmtOpts(list,sep){return(list||[]).map(o=>o.name+':'+o.price+(o.cogs?':'+o.cogs:'')).join(sep)}
function optInfo(p){
 const nv=(p.variants||[]).length,nt=(p.toppings||[]).length;
 return((nv||nt)?' · '+[nv?nv+' varian':'',nt?nt+' topping':''].filter(Boolean).join(', '):'')+expInfo(p);
}

function vown(v){return !!(v&&v.rm==='sendiri'&&(v.recipe||[]).length)}

function pkCost(p){return(p.paket||[]).reduce((a,r)=>{const b=db.products.find(x=>x.id===r.pid);return a+(+r.q||0)*(b?(b.recipe&&b.recipe.length&&b.notrack?rcost(b.recipe):+b.cogs||0):0)},0)}
function pkAvail(p){let m=Infinity;(p.paket||[]).forEach(r=>{const b=db.products.find(x=>x.id===r.pid);if(!b){m=0;return}if(!b.notrack&&(+r.q||0)>0)m=Math.min(m,Math.floor(((+b.stock||0)+1e-9)/r.q))});return m}

function wTickets(lines,base){

 if(bb.length)jobs.push({txt:kitchenText({...base,lines:bb},'bar'),kind:'bar'});

}
function wSend(){

 if(db.settings.tableMode&&S.type==='dine'&&!S.table){toast('Pilih meja dulu');S.pmode='meja';renderLeft();return}
 const un=S.cart.map(l=>({...l,qty:+(l.qty-(l.sent||0)).toFixed(3)})).filter(l=>l.qty>0);
 if(!un.length){toast('Tidak ada item baru');return}
 let printed=false;
 if(((W.state&&W.state.printBy)||'kasir')==='pelayan'){try{printed=wTickets(un,{type:S.type,channel:S.channel,table:S.table,cust:'',by:S.user.name,addendum:false})}catch(e){printed=false}}

async function wFlush(){
 if(W.busy)return;
 if(!W.q.length){wPaint();return}
 if(!W.ip){wPaint();const ok=await wFind();if(!ok)return}
 W.busy=true;
 try{
  while(W.q.length){
   const b=W.q[0],r=await wReq('order',b,9000);
   if(r&&r.ok){W.q.shift();wSaveQ();toast('Terkirim ke kasir'+(b.table?' · '+b.table:'')+(r.printed===false?' (tiket belum tercetak)':''));wPaint()}
   else throw new Error((r&&r.err)||'Ditolak kasir');
  }
  W.err='';
 }catch(e){W.err=e.message||'Gagal mengirim'}
 W.busy=false;
 if(W.q.length){clearTimeout(W.tm);W.tm=setTimeout(wFlush,5000)}
 wPaint();
}

async function wSrvPoll(){

  const r=await n.lanPop();

   let out;try{out=JSON.stringify(wRecv(it.body))}catch(e){out=JSON.stringify({ok:false,err:'gagal menyimpan'})}
   n.lanReply({rid:it.rid,json:out});
  });
 }catch(e){}
}

async function qAccept(o,auto){
 const bl=qBuild(o);
 if(bl.miss.length||!bl.lines.length){await qAck(o.id,'ditolak','Menu tidak tersedia');Q.pend=Q.pend.filter(x=>x.id!==o.id);qBadge();if(!auto)toast('Ada menu yang tidak ada di kasir: '+bl.miss.join(', ')+'. Pesanan ditolak.');return false}
 const a=await qAck(o.id,'diterima','');
 if(!a||!a.ok){if(!auto)toast('Gagal menghubungi server, coba lagi');return false}
 Q.pend=Q.pend.filter(x=>x.id!==o.id);
 if(a.already){qBadge();if(!auto)toast('Pesanan ini sudah diproses perangkat lain');return false}
 try{
  const r=wRecv({bid:'q'+o.id,by:'Pelanggan QR',cust:o.nama||'',type:'dine',table:o.meja,channel:'',printed:false,qr:true,quiet:!auto,lines:bl.lines});
  if(!r||!r.ok)throw new Error((r&&r.err)||'gagal');
  if(!auto)toast('Pesanan '+o.meja+' diterima');
 }catch(e){
  openModal(`<h3>Pesanan gagal dimasukkan</h3><div class="promo">Pesanan sudah ditandai diterima tetapi gagal masuk ke kasir. Catat manual:<br><b>${esc(o.meja)}</b> ${esc(o.nama||'')}<br>${(o.lines||[]).map(l=>esc(l.name)+(l.v?' ('+esc(l.v)+')':'')+' x'+l.qty).join('<br>')}</div><div class="mrow"><button class="btn" onclick="closeModal()">Tutup</button></div>`);
 }
 qBadge();return true;
}
async function qReject(id){
 const o=Q.pend.find(x=>x.id===id);if(!o)return;
 const why=(Q.sel[id]||'Maaf, pesanan tidak bisa diproses.');
 const a=await qAck(id,'ditolak',why);
 if(!a||!a.ok){toast('Gagal menghubungi server, coba lagi');return}
 Q.pend=Q.pend.filter(x=>x.id!==id);qBadge();qList();
}
async function qAcceptBtn(id){const o=Q.pend.find(x=>x.id===id);if(!o)return;const b=document.getElementById('qa_'+id);if(b)b.disabled=true;await qAccept(o,false);qList()}
function qList(){
 if(!document.getElementById('qlist'))return;
 const h=Q.pend.length?Q.pend.map(o=>{
  const sh=qShort(o),tot=sum(o.lines||[],l=>l.price*l.qty);
  return `<div class="promo" style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.meja)}${o.nama?' · '+esc(o.nama):''}</b><span class="mut">${fmtT(o.ts)}</span></div>
  ${(o.lines||[]).map(l=>`<div>${esc(l.name)}${l.v?' ('+esc(l.v)+')':''} × ${l.qty}${(l.t&&l.t.length)?'<br><small class="mut">+ '+esc(l.t.join(', '))+'</small>':''}${l.note?'<br><small class="mut">“'+esc(l.note)+'”</small>':''}</div>`).join('')}
  ${o.note?`<div class="mut" style="margin-top:6px">Catatan: ${esc(o.note)}</div>`:''}
  <div style="margin-top:6px"><b>${rp(tot)}</b> <span class="mut">(perkiraan, belum pajak/layanan)</span></div>
  ${sh.length?`<div style="color:var(--bad);margin-top:6px">Stok kurang: ${esc(sh.join(', '))}</div>`:''}
  <div class="mrow" style="margin-top:10px;flex-wrap:wrap"><select onchange="Q.sel['${o.id}']=this.value" style="flex:1;min-width:130px"><option>Maaf, pesanan tidak bisa diproses.</option><option>Menu sedang habis.</option><option>Toko sudah tutup.</option><option>Meja tidak sesuai, hubungi kasir.</option></select><button class="btn bad" onclick="qReject('${o.id}')">Tolak</button><button class="btn pri" id="qa_${o.id}" onclick="qAcceptBtn('${o.id}')">Terima</button></div></div>`}).join(''):`<div class="empty">${ic('cart',34)}<div>Tidak ada pesanan QR yang menunggu</div></div>`;
 document.getElementById('qlist').innerHTML=h;
}
function qOpen(){wPopHide();openModal(`<h3>Pesanan dari QR</h3><div class="mut" style="margin-bottom:10px">Pelanggan membayar di kasir. Terima untuk memasukkan ke pesanan meja dan mencetak tiket dapur.</div><div id="qlist"></div><div class="mrow"><button class="btn" onclick="closeModal()">Tutup</button></div>`,true);qList()}
function qBadge(){
 let e=document.getElementById('qpill');
 if(!Q.pend.length||isW()||!S.user){if(e)e.style.display='none';return}
 if(!e){e=document.createElement('button');e.id='qpill';e.onclick=qOpen;e.style.cssText='position:fixed;left:12px;bottom:14px;z-index:250;background:#b51218;color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(e)}
 e.style.display='block';e.textContent='🔔 '+Q.pend.length+' pesanan QR';
}
function qNotify(n){
 const o=Q.pend[Q.pend.length-1];if(!o)return;
 POPGO='q';
 const e=$('#wpop');if(!e)return;
 $('#wpt').textContent='Pesanan QR · '+o.meja;
 $('#wps').textContent=(o.nama?o.nama+' · ':'')+sum(o.lines||[],l=>l.qty)+' item'+(Q.pend.length>1?' · '+Q.pend.length+' menunggu':'');
 e.classList.add('on');clearTimeout(wPopHide.t);wPopHide.t=setTimeout(wPopHide,15000);
 wBeep();setTimeout(wBeep,350);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}
}
async function qPoll(){
 if(Q.busy||!qOn()||!S.user)return;Q.busy=true;
 try{
  if(Date.now()-Q.cfgT>30*60*1000){try{await qPushCfg()}catch(e){}}
  const res=await fetch(SY.url+(SY.url.includes('?')?'&':'?')+'action=qpull&token='+encodeURIComponent(SY.token)+'&_='+Date.now(),{redirect:'follow'});
  const r=await res.json();if(!r.ok)throw new Error(r.err||'ditolak server');
  Q.err='';const ids=new Set((r.orders||[]).map(x=>x.id));let fresh=0;
  for(const o of (r.orders||[])){
   if(!o||!o.id)continue;
   if(Q.pend.some(x=>x.id===o.id))continue;
   if(db.wbids&&db.wbids.includes('q'+o.id)){await qAck(o.id,'diterima','');continue}
   if(qCfg().auto){await qAccept(o,true);continue}
   Q.pend.push(o);fresh++;
  }
  Q.pend=Q.pend.filter(x=>ids.has(x.id));
  if(fresh)qNotify(fresh);
  qBadge();qList();setTimeout(qImgRun,300);
 }catch(e){Q.err=e.message||'gagal'}finally{Q.busy=false}
}
function qrCard(){
 const c=qCfg(),on=!!c.on,tb=(db.settings.tables||[]).map(qMeja).filter(Boolean);
 const st=!syOn()?'Belum tersambung ke toko (isi Kode Toko dulu).':!on?'Nonaktif.':Q.err?'Aktif, tetapi gagal mengambil pesanan: '+Q.err:'Aktif. Pesanan QR dicek tiap 8 detik saat kasir terbuka dan ada internet.';
 let qrs='';
 if(!/^https:\/\//.test((c.base||'').trim()))qrs='<div class="mut">Isi alamat halaman pesan di atas, lalu Simpan, agar QR meja muncul.</div>';
 else if(!syOn())qrs='<div class="mut">Sambungkan ke toko dulu.</div>';
 else qrs=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">${tb.map((n,i)=>`<div class="promo" style="text-align:center;margin:0"><div style="max-width:150px;margin:0 auto">${qSvg(qLink(n),150)}</div><b>${esc(n)}</b><div style="margin-top:6px"><button class="btn sm" data-i="${i}" onclick="qCopy(+this.dataset.i)">Salin link</button></div></div>`).join('')}</div>`;
 return card('Pesan via QR','Pelanggan scan QR di meja, pilih menu, lalu pesanan masuk ke kasir. Bayar tetap di kasir.',
 `<div class="fg">${fld('Terima pesanan QR',`<select id="q_on">${selOpt(on,[[true,'Aktif'],[false,'Nonaktif']])}</select>`)}${fld('Pesanan masuk',`<select id="q_au">${selOpt(!!c.auto,[[false,'Kasir menyetujui dulu (disarankan)'],[true,'Otomatis langsung masuk']])}</select>`)}
 ${fld('Alamat halaman pesan (pesan.html)',`<input id="q_b" placeholder="https://namauser.github.io/repo/pesan.html" value="${esc(c.base||'')}">`,true)}
 ${fld('Pesan untuk pelanggan (opsional)',`<input id="q_n" maxlength="160" placeholder="Contoh: Pesanan dibayar di kasir" value="${esc(c.note||'')}">`,true)}</div>
 <div id="q_st" class="mut" style="margin:10px 0;font-size:13.5px">${esc(st)}</div>
 ${on?`<div class="mut" style="font-size:13px;margin-bottom:6px">Foto menu: ${Q.imgErr?'<span style="color:var(--bad)">gagal ('+esc(Q.imgErr)+'). Pastikan Code.gs terbaru sudah dipasang dan izin Drive diberikan.</span>':'dikirim otomatis dari foto produk di perangkat ini.'} <a href="#" onclick="qImgReset();return false">Kirim ulang foto</a></div>`:''}
 <div class="quick"><button class="btn pri" onclick="qSaveCfg()">Simpan &amp; kirim ke server</button><button class="btn" onclick="qOpen()">Lihat pesanan masuk (${Q.pend.length})</button></div>
 <div class="mut" style="font-size:12.5px;margin:10px 0">Aktifkan hanya di <b>satu</b> perangkat kasir. Perlu internet dan Code.gs versi terbaru di Google Sheet toko. Mode "Otomatis" langsung mencetak tiket dapur tanpa persetujuan, jadi hanya pakai bila toko siap menerima pesanan iseng.</div>
 <h4 style="margin:14px 0 8px">QR tiap meja</h4>${qrs}`);
}
async function qSaveCfg(){
 const c=qCfg();c.on=document.getElementById('q_on').value==='true';c.auto=document.getElementById('q_au').value==='true';
 c.base=(document.getElementById('q_b').value||'').trim();c.note=(document.getElementById('q_n').value||'').trim().slice(0,160);
 if(c.on&&!/^https:\/\//.test(c.base)){c.on=false;save();toast('Isi alamat halaman pesan (harus diawali https://)');return setModal('qr')}
 if(c.on&&!syOn()){c.on=false;save();toast('Sambungkan ke toko dulu');return setModal('qr')}
 save();let msg='Tersimpan';
 if(syOn()){
  try{const r=await qPushCfg();if(!r||!r.ok){c.on=false;save();msg='Server menolak: '+((r&&r.err)||'?')+'. Pasang Code.gs terbaru di Google Sheet toko ini, lalu coba lagi.'}}
  catch(e){c.on=false;save();msg='Gagal menghubungi server. Pengaturan QR dinonaktifkan, coba lagi saat online.'}
 }
 toast(msg);setModal('qr');if(qOn())qPoll();
}
function qCopy(i){
 const n=(db.settings.tables||[]).map(qMeja).filter(Boolean)[i],l=qLink(n);if(!l)return;
 try{navigator.clipboard.writeText(l).then(()=>toast('Link '+n+' disalin'),()=>prompt('Salin link:',l))}catch(e){prompt('Salin link:',l)}
}

function wBeep(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},220)}catch(e){}
}
function wPopHide(){clearTimeout(wPopHide.t);const e=$('#wpop');if(e)e.classList.remove('on');wPopHide.n=0}
function wPopGo(){wPopHide();if(POPGO==='q'){qOpen();return}try{nav('orders')}catch(e){}}
function wPop(o,b,had){const e=$('#wpop');if(!e)return;POPGO='orders';wPopHide.n=(wPopHide.n||0)+1;const n=wPopHide.n;
 $('#wpt').textContent=(had?'Tambahan pesanan · ':'Pesanan baru · ')+(o.table||typeLabel(o.type,o.channel));
 $('#wps').textContent='dari '+(b.by||'pelayan')+' · '+b.lines.reduce((a,l)=>a+(+l.qty||0),0)+' item'+(n>1?' · +'+(n-1)+' lainnya':'');
 e.classList.add('on');clearTimeout(wPopHide.t);wPopHide.t=setTimeout(()=>{const k=wPopHide.n;wPopHide();},15000);
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}
function wRecv(b){
 if(!b||!Array.isArray(b.lines)||!b.lines.length)return{ok:false,err:'pesanan kosong'};
 db.wbids=db.wbids||[];
 if(db.wbids.includes(b.bid))return{ok:true,dup:true,printed:true};
 let o=b.table?db.orders.find(x=>x.table===b.table):null;const had=!!(o&&o.items.length);
 if(!o){o={id:uid(),ts:Date.now(),by:b.by||'Pelayan',items:[],manual:{type:'pct',val:0},vc:'',pt:0,type:b.type||'dine',table:b.table||'',cust:b.cust||'',custId:'',servers:[],channel:b.channel||'',fromW:true};db.orders.push(o)}
 let printed=b.printed===true;
 if(!printed&&(b.qr||wPrintBy()==='kasir')){try{printed=wTickets(b.lines,{type:o.type,channel:o.channel,table:o.table,cust:o.cust,by:b.by||'Pelayan',addendum:had})}catch(e){printed=false}}
 b.lines.forEach(l=>{
  const k=l.key||l.pid+'||',ex=o.items.find(x=>(x.key||x.pid+'||')===k);
  if(ex){ex.qty=+(ex.qty+l.qty).toFixed(3);ex.sent=+((ex.sent||0)+(l.sent||0)).toFixed(3)}else o.items.push({...l});
 });
 db.wbids.push(b.bid);if(db.wbids.length>300)db.wbids=db.wbids.slice(-300);
 save();wStPush();
 try{renderNav();if(S.user&&S.view==='orders')renderLeft();if(S.user&&S.view==='pos'){if(S.pmode==='meja')renderLeft();if(S.orderId===o.id)renderCart()}}catch(e){}
 if(!b.quiet){wPop(o,b,had);wBeep();setTimeout(wBeep,350)}
 return{ok:true,id:o.id,merged:had,printed:printed};
}
function wCard(){
 const n=NAT0(),on=wRecvOn();
 const st=!n?'Hanya tersedia di aplikasi APK.':!on?'Nonaktif.':W.srvOn?'Aktif. Alamat perangkat ini: '+(W.myIp||'-')+' (HP pelayan mencarinya otomatis).':'Belum aktif'+(W.srvErr?': '+W.srvErr:'.');
 return card('Pesanan Pelayan','Terima pesanan dari HP pelayan lewat Wi-Fi toko. Aktifkan hanya di satu perangkat kasir.',
 `<div class="fg">${fld('Terima pesanan pelayan',`<select id="w_on">${selOpt(on,[[true,'Aktif'],[false,'Nonaktif']])}</select>`)}${fld('Tiket dapur dan bar dicetak oleh',`<select id="w_pb">${selOpt(wPrintBy()==='pelayan',[[false,'Kasir (perangkat ini)'],[true,'HP pelayan']])}</select>`)}</div>
 <div id="w_st" class="mut" style="margin:10px 0;font-size:13.5px">${esc(st)}</div>
 <div class="quick"><button class="btn pri" onclick="wSaveCfg()">Simpan</button></div>
 <div class="mut" style="font-size:12.5px;margin-top:10px">Cara pakai: tambahkan karyawan dengan peran <b>Pelayan</b> di menu Karyawan. Di HP pelayan (APK, Kode Toko sama, satu Wi-Fi), login dengan akun itu. HP akan mencari kasir sendiri. Sebaiknya perangkat kasir memakai IP tetap di router.</div>`);
}
async function wSaveCfg(){
 db.settings.wRecv=document.getElementById('w_on').value==='true';
 db.settings.wPrintBy=document.getElementById('w_pb').value==='true'?'pelayan':'kasir';
 save();
 if(wRecvOn()){await wSrvStart()}else wSrvStop();
 wStPush();toast('Tersimpan');setModal('pelayan');
}
(async()=>{
 try{const n=NAT0();if(n){let ok=false;try{const li=await n.launchInfo();ok=!!(li&&li.restored)}catch(e){ok=false}if(!ok)sessClear()}}catch(e){}
 renderApp();
 document.documentElement.classList.add('ready');
 try{if(isW())wStart();else if(wRecvOn())wSrvStart()}catch(e){}
 try{setInterval(qPoll,8000);setTimeout(qPoll,3000)}catch(e){}
 checkUpdate();setInterval(checkUpdate,6*3600*1000);
})();
setTimeout(function(){document.documentElement.classList.add('ready')},6000);
try{var cs=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(cs){cs.setOverlaysWebView&&cs.setOverlaysWebView({overlay:false});cs.setBackgroundColor&&cs.setBackgroundColor({color:'#0d0d0d'});cs.setStyle&&cs.setStyle({style:'DARK'})}}catch(e){}
document.addEventListener('deviceready',function(){try{var b=window.StatusBar;if(b){b.overlaysWebView(false);b.backgroundColorByHexString('#0d0d0d');b.styleLightContent()}}catch(e){}},false);
</script>
