<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f5f5f5;background:radial-gradient(700px 420px at 50% -10%,rgba(227,25,31,.28),transparent 70%),#0a0a0a}
.wrap{max-width:480px;margin:0 auto;padding:28px 18px 40px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.hd img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.hd b{display:block;font-size:20px;letter-spacing:.12em}.hd b span{color:#ff4a50;font-weight:400}
.hd small{color:#a3a3a3}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin-bottom:14px}
.no{color:#a3a3a3;font-size:13px}.nm{font-size:19px;font-weight:700;margin:4px 0}.ds{color:#d4d4d4;font-size:14.5px}
.big{font-size:24px;font-weight:800;margin:4px 0 2px}.big.done{color:#22c55e}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:0 0 18px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:#2a2a2a}
.steps li.ok:not(:last-child)::before{background:#e3191f}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid #3a3a3a;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;background:#0a0a0a;color:#737373}
li.ok .dot{background:#e3191f;border-color:#e3191f;color:#fff}
li.now .dot{box-shadow:0 0 0 5px rgba(227,25,31,.25)}
.st b{display:block;font-size:15px}.st small{color:#a3a3a3;font-size:12.5px}
li:not(.ok) .st b{color:#737373}
.pay{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700}
.pay.g{background:rgba(34,197,94,.15);color:#4ade80}.pay.k{background:rgba(245,158,11,.15);color:#fbbf24}.pay.v{background:rgba(227,25,31,.15);color:#ff6b70}
.note{color:#d4d4d4;font-size:14px;line-height:1.5}
.err{text-align:center;color:#d4d4d4;padding:30px 10px}
.ft{text-align:center;color:#737373;font-size:12px;margin-top:20px}
button{background:#e3191f;color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;width:100%;margin-top:6px}
</style>

<script>
const q=new URLSearchParams(location.search);
const api=q.get('s')?'https://script.google.com/macros/s/'+encodeURIComponent(q.get('s'))+'/exec':(q.get('u')||'');
const tok=q.get('t')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>ts?new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts)):'';
async function load(){
 const el=document.getElementById('app');
 if(!/^https:\/\//.test(api)||!/^[A-Za-z0-9]{12,40}$/.test(tok)){el.innerHTML='<div class="card err">Link status tidak valid. Minta link baru ke kasir RB Ban.</div>';return}
 try{
  const r=await (await fetch(api+(api.includes('?')?'&':'?')+'action=qjob&id='+encodeURIComponent(tok)+'&_='+Date.now(),{redirect:'follow'})).json();
  if(!r.ok)throw new Error(r.err||'Data tidak ditemukan');
  if(r.biz)document.getElementById('biz').textContent=r.biz;
  const steps=r.steps||[],i=Math.max(0,Math.min(steps.length-1,+r.i||0)),done=i>=steps.length-1;
  const when={};(r.hist||[]).forEach(h=>{when[h.i]=h.ts});
  el.innerHTML=`<div class="card"><div class="no">${esc(r.no)}</div><div class="nm">${esc(r.name)}</div>${r.desc?`<div class="ds">${esc(r.desc)}</div>`:''}
   <div style="margin-top:14px" class="no">Status sekarang</div><div class="big ${done?'done':''}">${esc(steps[i]||'-')}</div>
   ${r.pay&&r.pay.l?`<span class="pay ${esc(r.pay.k)}">${esc(r.pay.l)}</span>`:''}
   <ul class="steps">${steps.map((s,k)=>`<li class="${k<=i?'ok':''} ${k===i?'now':''}"><span class="dot">${k<=i?'✓':k+1}</span><span class="st"><b>${esc(s)}</b><small>${k<=i&&when[k]?fmt(when[k]):''}</small></span></li>`).join('')}</ul></div>
   ${r.note?`<div class="card note">${esc(r.note)}</div>`:''}`;
 }catch(e){el.innerHTML='<div class="card err">Status belum bisa dimuat.<br><small>'+esc(e.message)+'</small><br><br><button onclick="load()">Coba lagi</button></div>'}
